<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <header>
        <h1>Lista de Tarefas</h1>
        <button type="button" id="botao-nova-tarefa">Nova Tarefa</button>
        <button type="button" id="botao-cancelar">Cancelar</button>
        </header>
        <form>
            <h2>Minhas Tarefas</h2>
            <input type="text" id="novo-texto" required placeholder="ex: estudar inglês">
            <button type="submit">Cadastrar</button>
            <button type="button" id="botao-limpar">Limpar</button>
        </form>
        <ol id="lista-de-textos"></ol>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="./main.js"></script>
</body>
</html>
